version: '3.8'

services:
  backend:
    build: ./server
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules 

  frontend:
    build: ./client
    volumes:
      - ./client:/app
      - /app/node_modules 
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
