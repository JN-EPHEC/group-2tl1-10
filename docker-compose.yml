version: '3.8'

services:
  backend:
    build: ./server
    env_file:
      - ./server/.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules 

  frontend:
    build: ./client
    volumes:
      - ./client:/app
      - /app/node_modules 
    depends_on:
      - backend
